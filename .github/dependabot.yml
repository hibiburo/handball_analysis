version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # 更新の PR が増えすぎないよう、確認は月に1回にする（2026-11-09 に毎週から変更）
    schedule:
      interval: monthly
    groups:
      # 開発用ツールはまとめて1つの Pull Request にする
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint が TypeScript 7 に未対応のため、対応するまでメジャー更新を除外する（docs/architecture.md 1.1）
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 実行環境の Node.js（24 LTS）に型定義を合わせるため、メジャー更新を除外する
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
